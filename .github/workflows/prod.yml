name: CI / Prod

on:
  push:
    branches: [main]
    # Deploy only when something that ends up in an image or on the server changes. Edits to
    # .claude/, .agents/, docs, dev-only files (compose.dev/local, dev.nginx) or README never
    # reach prod, so they must not rebuild three images and restart the stack.
    #
    # Keep in sync with what the build and deploy use:
    #   images:  apps/*/Dockerfile COPY sources, .dockerignore, the pnpm/turbo root files
    #   server:  deploy-app.sh `git pull`s the repo, so compose.prod.yaml, scripts/ and
    #            pro.nginx/ take effect through this workflow
    # A push that touches none of these starts no run; use "Run workflow" (workflow_dispatch)
    # to force one.
    paths:
      - apps/**
      - packages/**
      - patches/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - tsconfig.json
      - .npmrc
      - .dockerignore
      - compose.prod.yaml
      - scripts/**
      - pro.nginx/**
    # .github/ is deliberately not listed: editing a workflow or action never starts a deploy.
    # After changing one, run the workflow by hand if you want it exercised.
  # Manual "Run workflow" button / `gh workflow run prod.yml --ref main`. The prod environment
  # only accepts deployments from main, so running it on another branch is refused.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

# Least privilege by default. Without this, every job inherits the repository's
# default GITHUB_TOKEN scope — which on older repos is read/write on all scopes —
# including the deploy job, which needs no token access at all. The build job
# raises this to `packages: write` locally where it actually pushes to GHCR.
permissions:
  contents: read

# Concurrency is set per job, not for the whole workflow, on purpose:
#   - test and build-and-push cancel a superseded run, so only the newest push is built and a
#     stale build never wastes runner minutes. A cancelled build also skips that run's deploy.
#   - deploy is never cancelled: killing deploy-app.sh halfway (migrations, container
#     recreation) would leave prod half-applied. It queues instead, and GitHub keeps only the
#     newest pending deploy, so runs cannot pile up.
# Workflow-level `cancel-in-progress: true` would cancel a running deploy too.

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: prod-test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run lint and tests
        uses: Thiago-dcode/gh-actions/.github/actions/check-ci@631faa09833433292001a45e51ce3649da65d73b # v1
        with:
          package-manager: pnpm

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod
    # One group per matrix leg, otherwise the api/web/worker jobs of the same run would cancel
    # each other.
    concurrency:
      group: prod-build-${{ matrix.app }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    # One runner per image so the three builds run in parallel instead of queueing.
    strategy:
      fail-fast: true
      matrix:
        app: [api, worker, web]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set image owner (GHCR requires lowercase)
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # BuildKit `RUN --mount=type=cache` mounts (Turbo's task cache, Next's
      # incremental cache) live on the runner and vanish with it, and the registry
      # layer cache below does not export them. Round-trip them through the Actions
      # cache so a source change recompiles only what actually changed. They are small
      # next to the layers, so they stay clear of the 10 GB cap.
      - name: Restore build tool caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: buildkit-cache
          key: buildkit-prod-${{ matrix.app }}-${{ github.sha }}
          restore-keys: |
            buildkit-prod-${{ matrix.app }}-

      # Pinned to a commit SHA (v3.4.0): it runs docker commands with this job's
      # GHCR write token. Update deliberately.
      - name: Inject build tool caches into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "buildkit-cache/turbo": { "target": "/root/.cache/turbo", "id": "turbo-cache" },
              "buildkit-cache/next": { "target": "/workspace/apps/web/.next/cache", "id": "nextjs-cache-dev" }
            }

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The layer cache lives in GHCR, not the Actions cache: the repo-wide Actions
      # cache is capped at 10 GB and was permanently full, so layers were evicted
      # before they could be reused. One cache image per app and environment keeps
      # each build from evicting the others' layers.
      - name: Build and push ${{ matrix.app }}
        if: matrix.app != 'web'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/a11studio-prod-${{ matrix.app }}:main
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/a11studio-prod-${{ matrix.app }}:sha-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/a11studio-cache-prod-${{ matrix.app }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/a11studio-cache-prod-${{ matrix.app }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

      # Web is a separate step so its build-args are never handed to the
      # api and worker builds.
      - name: Build and push web
        if: matrix.app == 'web'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/a11studio-prod-web:main
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/a11studio-prod-web:sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ secrets.NEXT_PUBLIC_WS_URL }}
            NEXT_PUBLIC_GEOAPIFY_URL=${{ secrets.NEXT_PUBLIC_GEOAPIFY_URL }}
            NEXT_PUBLIC_GEOAPIFY_KEY=${{ secrets.NEXT_PUBLIC_GEOAPIFY_KEY }}
            NEXT_PUBLIC_GA_ID=${{ secrets.NEXT_PUBLIC_GA_ID }}
            NEXT_PUBLIC_CDN_URL=${{ secrets.CDN_URL }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/a11studio-cache-prod-web:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/a11studio-cache-prod-web:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: prod
    # Never cancelled; see the note above `jobs:`.
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    # `packages: read` lets the run's own GITHUB_TOKEN pull the images this workflow
    # just pushed, which replaces the long-lived GHCR PAT entirely — see the login
    # line below.
    permissions:
      contents: read
      packages: read
    steps:
      # The local actions below are loaded from the repo, so it must be checked out first.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: SSH deploy
        uses: Thiago-dcode/gh-actions/.github/actions/ssh-deploy@aeefa072cc9c649cf2ee116f21b1051668833187 # main on 2026-11-09
        with:
          deploy-script: ${{ secrets.SSH_DEPLOY_DIR }}/scripts/deploy-app.sh
          deploy-args: prod
          ssh-host: ${{ secrets.SSH_HOST }}
          ssh-user: ${{ secrets.SSH_USER }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Per-run token, not a stored PAT — see the ssh-deploy action.
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}
          ghcr-user: ${{ github.actor }}

      # Anonymous public HTML is edge-cached (docs/infrastructure.md, "Edge HTML cache"), and a
      # cached page references the previous build's /_next/static chunks and server-action IDs,
      # which are gone now. Runs only after the deploy above succeeded.
      - name: Purge Cloudflare cache
        timeout-minutes: 5
        uses: Thiago-dcode/gh-actions/.github/actions/cloudflare-purge-cache@9029a50006934e98c37d76346f6bdc9ec9007ea7 # main on 2026-11-07
        with:
          domain: a11studio.com
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          zone-id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
