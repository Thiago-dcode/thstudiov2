name: CI / Dev

on:
  pull_request:
  push:
    branches: [develop]

env:
  REGISTRY: ghcr.io

# Least privilege by default. Without this, every job inherits the repository's
# default GITHUB_TOKEN scope — which on older repos is read/write on all scopes —
# including the deploy job, which needs no token access at all. The build job
# raises this to `packages: write` locally where it actually pushes to GHCR.
permissions:
  contents: read

# A new push to the same branch makes an in-flight run obsolete. Deploy runs are
# exempt from cancellation so a half-applied deploy is never interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run lint and tests
        uses: ./.github/actions/run-tests

  build-and-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      packages: write
    # One runner per image so the three builds run in parallel instead of queueing.
    strategy:
      fail-fast: true
      matrix:
        app: [api, worker, web]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set image owner (GHCR requires lowercase)
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # BuildKit `RUN --mount=type=cache` mounts (Turbo's task cache, Next's
      # incremental cache) live on the runner and vanish with it, and the registry
      # layer cache below does not export them. Round-trip them through the Actions
      # cache so a source change recompiles only what actually changed. They are small
      # next to the layers, so they stay clear of the 10 GB cap.
      - name: Restore build tool caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: buildkit-cache
          key: buildkit-dev-${{ matrix.app }}-${{ github.sha }}
          restore-keys: |
            buildkit-dev-${{ matrix.app }}-

      # Pinned to a commit SHA (v3.4.0): it runs docker commands with this job's
      # GHCR write token. Update deliberately.
      - name: Inject build tool caches into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "buildkit-cache/turbo": { "target": "/root/.cache/turbo", "id": "turbo-cache" },
              "buildkit-cache/next": { "target": "/workspace/apps/web/.next/cache", "id": "nextjs-cache-dev" }
            }

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The layer cache lives in GHCR, not the Actions cache: the repo-wide Actions
      # cache is capped at 10 GB and was permanently full, so layers were evicted
      # before they could be reused. One cache image per app and environment keeps
      # each build from evicting the others' layers.
      - name: Build and push ${{ matrix.app }}
        if: matrix.app != 'web'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/a11studio-dev-${{ matrix.app }}:develop
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/a11studio-dev-${{ matrix.app }}:sha-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/a11studio-cache-dev-${{ matrix.app }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/a11studio-cache-dev-${{ matrix.app }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

      # Web is a separate step so its build-args are never handed to the
      # api and worker builds.
      - name: Build and push web
        if: matrix.app == 'web'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/a11studio-dev-web:develop
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/a11studio-dev-web:sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ secrets.NEXT_PUBLIC_WS_URL }}
            NEXT_PUBLIC_GEOAPIFY_URL=${{ secrets.NEXT_PUBLIC_GEOAPIFY_URL }}
            NEXT_PUBLIC_GEOAPIFY_KEY=${{ secrets.NEXT_PUBLIC_GEOAPIFY_KEY }}
            NEXT_PUBLIC_CDN_URL=${{ secrets.CDN_URL }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/a11studio-cache-dev-web:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/a11studio-cache-dev-web:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

  deploy:
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: dev
    # `packages: read` lets the run's own GITHUB_TOKEN pull the images this workflow
    # just pushed, which replaces the long-lived GHCR PAT entirely — see the login
    # line below.
    permissions:
      contents: read
      packages: read
    steps:
      # The local action below is loaded from the repo, so it must be checked out first.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: SSH deploy
        uses: ./.github/actions/ssh-deploy
        with:
          deploy-script: ${{ secrets.SSH_DEPLOY_DIR }}/scripts/deploy-app.sh
          deploy-args: dev
          ssh-host: ${{ secrets.SSH_HOST }}
          ssh-user: ${{ secrets.SSH_USER }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Per-run token, not a stored PAT — see the ssh-deploy action.
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}
          ghcr-user: ${{ github.actor }}
