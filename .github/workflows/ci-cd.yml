name: CI / CD

on:
  pull_request:
  push:
    branches: [develop, main]

env:
  REGISTRY: ghcr.io

# Least privilege by default. Without this, every job inherits the repository's
# default GITHUB_TOKEN scope — which on older repos is read/write on all scopes —
# including the deploy jobs, which need no token access at all. The build jobs
# raise this to `packages: write` locally where they actually push to GHCR.
permissions:
  contents: read

# A new push to the same branch makes an in-flight run obsolete. Deploy runs are
# exempt from cancellation so a half-applied deploy is never interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup pnpm cache
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint

      - name: Run tests
        run: pnpm turbo run test

  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image owner (GHCR requires lowercase)
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/a11studio-dev-api:develop
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/a11studio-dev-api:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/a11studio-dev-worker:develop
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/a11studio-dev-worker:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/a11studio-dev-web:develop
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/a11studio-dev-web:sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_GEOAPIFY_URL=${{ secrets.NEXT_PUBLIC_GEOAPIFY_URL }}
            NEXT_PUBLIC_GEOAPIFY_KEY=${{ secrets.NEXT_PUBLIC_GEOAPIFY_KEY }}
            APP_URL=${{ secrets.APP_URL }}
            API_V1_URL=${{ secrets.API_V1_URL }}
            GEOAPIFY_URL=${{ secrets.GEOAPIFY_URL }}
            SUPPORT_EMAIL=${{ secrets.SUPPORT_EMAIL }}
            SUPPORT_USERNAME=${{ secrets.SUPPORT_USERNAME }}
            REGISTRATION_IS_CLOSED=${{ secrets.REGISTRATION_IS_CLOSED }}
            CDN_URL=${{ secrets.CDN_URL }}
          # Real secrets go through BuildKit secret mounts, never build-args: a
          # build-arg becomes ENV in the builder stage and `cache-to: mode=max`
          # exports that stage to the shared Actions cache.
          secrets: |
            app_api_key=${{ secrets.APP_API_KEY }}
            app_token=${{ secrets.APP_TOKEN }}
            geoapify_key=${{ secrets.GEOAPIFY_KEY }}
            encryption_secret=${{ secrets.ENCRYPTION_SECRET }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: SSH deploy
        # Pinned to a commit SHA, not the mutable v1.0.3 tag: this action receives the
        # root SSH private key for the droplet, so a retagged upstream release would
        # hand over the host. Update deliberately, verifying the new SHA.
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Deliberately a literal, not `secrets.SSH_PORT`. A port number is not a
          # secret, and storing one has two costs: GitHub masks every occurrence of
          # the value in every log line (a secret of "22" redacts unrelated 22s), and
          # a typo'd value surfaces only as `parse "***" as int` with nothing to
          # inspect — exactly how the prod deploy failed on run 31087852716.
          port: 22
          script_stop: true
          command_timeout: 15m
          # Passed as env rather than interpolated into the script text: a secret
          # containing a quote or newline would otherwise break out of the string and
          # inject into a root shell.
          envs: DEPLOY_DIR,GHCR_TOKEN,GHCR_USER
          script: |
            set -eu
            cd "$DEPLOY_DIR"
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            bash ./scripts/deploy-dev.sh
        env:
          DEPLOY_DIR: ${{ secrets.SSH_DEPLOY_DIR }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_USERNAME }}

  build-and-push-prod:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image owner (GHCR requires lowercase)
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/a11studio-prod-api:main
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/a11studio-prod-api:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/a11studio-prod-worker:main
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/a11studio-prod-worker:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/a11studio-prod-web:main
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/a11studio-prod-web:sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_GEOAPIFY_URL=${{ secrets.NEXT_PUBLIC_GEOAPIFY_URL }}
            NEXT_PUBLIC_GEOAPIFY_KEY=${{ secrets.NEXT_PUBLIC_GEOAPIFY_KEY }}
            APP_URL=${{ secrets.APP_URL }}
            API_V1_URL=${{ secrets.API_V1_URL }}
            GEOAPIFY_URL=${{ secrets.GEOAPIFY_URL }}
            SUPPORT_EMAIL=${{ secrets.SUPPORT_EMAIL }}
            SUPPORT_USERNAME=${{ secrets.SUPPORT_USERNAME }}
            REGISTRATION_IS_CLOSED=${{ secrets.REGISTRATION_IS_CLOSED }}
            CDN_URL=${{ secrets.CDN_URL }}
          # See the dev build step: secrets must not travel as build-args.
          secrets: |
            app_api_key=${{ secrets.APP_API_KEY }}
            app_token=${{ secrets.APP_TOKEN }}
            geoapify_key=${{ secrets.GEOAPIFY_KEY }}
            encryption_secret=${{ secrets.ENCRYPTION_SECRET }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-prod:
    needs: build-and-push-prod
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: SSH deploy
        # SHA-pinned — see the dev deploy job for why.
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Literal, not a secret — see the dev deploy job.
          port: 22
          script_stop: true
          command_timeout: 15m
          envs: DEPLOY_DIR,GHCR_TOKEN,GHCR_USER
          script: |
            set -eu
            cd "$DEPLOY_DIR"
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            bash ./scripts/deploy-prod.sh
        env:
          DEPLOY_DIR: ${{ secrets.SSH_DEPLOY_DIR }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_USERNAME }}
