name: Connect WireGuard
description: >-
  Brings up a WireGuard tunnel on a Linux runner from individual fields (never a raw wg.conf),
  then waits for a handshake so an unreachable peer fails here instead of as a later SSH timeout.
  Disconnect with `sudo wg-quick down <interface>` in an `if: always()` step.

inputs:
  private-key:
    description: This runner's (CI peer's) private key. Pass it from a secret.
    required: true
  address:
    description: The CI peer's address(es) inside the tunnel, comma-separated CIDRs, e.g. 10.8.0.3/32.
    required: true
  peer-public-key:
    description: The server's public key.
    required: true
  endpoint:
    description: The server's public host:port, e.g. 134.209.31.146:51820 or [2001:db8::1]:51820.
    required: true
  allowed-ips:
    description: >-
      Comma-separated CIDRs routed through the tunnel. Keep it to what CI needs, usually the
      server's tunnel IP (e.g. 10.8.0.1/32). A full tunnel would route GitHub/GHCR traffic too.
    required: true
  preshared-key:
    description: Optional preshared key (wg genpsk). Pass it from a secret.
    required: false
    default: ""
  keepalive:
    description: PersistentKeepalive in seconds. Also makes the handshake start immediately.
    required: false
    default: "25"
  interface:
    description: Interface name; also the name of the generated /etc/wireguard/<interface>.conf.
    required: false
    default: wg0
  handshake-timeout:
    description: Seconds to wait for the first handshake before failing.
    required: false
    default: "20"

outputs:
  interface:
    description: The interface that was brought up.
    value: ${{ inputs.interface }}

runs:
  using: composite
  steps:
    - name: Install wireguard-tools
      shell: bash
      run: |
        set -euo pipefail
        if command -v wg-quick > /dev/null 2>&1; then
          exit 0
        fi
        # Try without a package-index refresh first; it is the slow part.
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends wireguard-tools > /dev/null 2>&1 || {
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends wireguard-tools > /dev/null
        }

    - name: Write config and bring up ${{ inputs.interface }}
      shell: bash
      # Inputs go through env, never interpolated into the script, and each one is validated
      # below. That keeps a stray newline from smuggling a PostUp/PreDown line (which wg-quick
      # runs as root) or a second section into the generated config.
      env:
        WG_PRIVATE_KEY: ${{ inputs.private-key }}
        WG_PRESHARED_KEY: ${{ inputs.preshared-key }}
        WG_ADDRESS: ${{ inputs.address }}
        WG_PEER_PUBLIC_KEY: ${{ inputs.peer-public-key }}
        WG_ENDPOINT: ${{ inputs.endpoint }}
        WG_ALLOWED_IPS: ${{ inputs.allowed-ips }}
        WG_KEEPALIVE: ${{ inputs.keepalive }}
        WG_INTERFACE: ${{ inputs.interface }}
      run: |
        set -euo pipefail

        fail() { echo "::error::$1"; exit 1; }
        strip() { printf '%s' "$1" | tr -d '[:space:]'; }

        WG_PRIVATE_KEY=$(strip "$WG_PRIVATE_KEY")
        WG_PRESHARED_KEY=$(strip "$WG_PRESHARED_KEY")
        WG_ADDRESS=$(strip "$WG_ADDRESS")
        WG_PEER_PUBLIC_KEY=$(strip "$WG_PEER_PUBLIC_KEY")
        WG_ENDPOINT=$(strip "$WG_ENDPOINT")
        WG_ALLOWED_IPS=$(strip "$WG_ALLOWED_IPS")

        if [ -n "$WG_PRIVATE_KEY" ]; then echo "::add-mask::$WG_PRIVATE_KEY"; fi
        if [ -n "$WG_PRESHARED_KEY" ]; then echo "::add-mask::$WG_PRESHARED_KEY"; fi

        # A WireGuard key is 32 bytes, base64: 43 chars + '='.
        key_re='^[A-Za-z0-9+/]{42}[AEIMQUYcgkosw048]=$'
        cidr_re='^[0-9A-Fa-f:.]+/[0-9]{1,3}$'
        cidr_list_re="^[0-9A-Fa-f:.]+/[0-9]{1,3}(,[0-9A-Fa-f:.]+/[0-9]{1,3})*$"

        [[ "$WG_PRIVATE_KEY" =~ $key_re ]] || fail "private-key is not a valid WireGuard key."
        [[ "$WG_PEER_PUBLIC_KEY" =~ $key_re ]] || fail "peer-public-key is not a valid WireGuard key."
        if [ -n "$WG_PRESHARED_KEY" ]; then
          [[ "$WG_PRESHARED_KEY" =~ $key_re ]] || fail "preshared-key is not a valid WireGuard key."
        fi
        [[ "$WG_ADDRESS" =~ $cidr_list_re ]] || fail "address must be comma-separated CIDRs, e.g. 10.8.0.3/32 (got '$WG_ADDRESS')."
        [[ "$WG_ALLOWED_IPS" =~ $cidr_list_re ]] || fail "allowed-ips must be comma-separated CIDRs, e.g. 10.8.0.1/32 (got '$WG_ALLOWED_IPS')."
        [[ "$WG_ENDPOINT" =~ ^([A-Za-z0-9.-]+|\[[0-9A-Fa-f:]+\]):[0-9]{1,5}$ ]] || fail "endpoint must be host:port (got '$WG_ENDPOINT')."
        [[ "$WG_KEEPALIVE" =~ ^[0-9]{1,5}$ ]] || fail "keepalive must be a number of seconds (got '$WG_KEEPALIVE')."
        [[ "$WG_INTERFACE" =~ ^[A-Za-z0-9_=+.-]{1,15}$ ]] || fail "interface must be a valid interface name (got '$WG_INTERFACE')."

        case ",$WG_ALLOWED_IPS," in
          *,0.0.0.0/0,*|*,::/0,*)
            echo "::warning::allowed-ips is a full tunnel; all runner traffic (GitHub, GHCR, Cloudflare) will go through the VPN server." ;;
        esac

        conf="/etc/wireguard/${WG_INTERFACE}.conf"
        sudo install -d -m 700 /etc/wireguard
        # Built in memory and written root-only, so the key never lands in a world-readable file.
        {
          echo "[Interface]"
          echo "PrivateKey = $WG_PRIVATE_KEY"
          echo "Address = $WG_ADDRESS"
          echo
          echo "[Peer]"
          echo "PublicKey = $WG_PEER_PUBLIC_KEY"
          if [ -n "$WG_PRESHARED_KEY" ]; then echo "PresharedKey = $WG_PRESHARED_KEY"; fi
          echo "Endpoint = $WG_ENDPOINT"
          echo "AllowedIPs = $WG_ALLOWED_IPS"
          if [ "$WG_KEEPALIVE" != "0" ]; then echo "PersistentKeepalive = $WG_KEEPALIVE"; fi
        } | sudo install -m 600 /dev/stdin "$conf"

        sudo wg-quick up "$WG_INTERFACE"

    - name: Wait for handshake
      shell: bash
      env:
        WG_INTERFACE: ${{ inputs.interface }}
        WG_ALLOWED_IPS: ${{ inputs.allowed-ips }}
        WG_TIMEOUT: ${{ inputs.handshake-timeout }}
      run: |
        set -euo pipefail
        [[ "$WG_TIMEOUT" =~ ^[0-9]+$ ]] || { echo "::error::handshake-timeout must be a number."; exit 1; }

        # Traffic into the tunnel starts a handshake even if keepalive is off. The first allowed
        # IP is pinged for that; its reply (or lack of one, if ICMP is filtered) does not matter.
        first_ip=$(printf '%s' "$WG_ALLOWED_IPS" | tr -d '[:space:]' | cut -d, -f1 | cut -d/ -f1)

        for ((i = 0; i < WG_TIMEOUT; i++)); do
          latest=$(sudo wg show "$WG_INTERFACE" latest-handshakes | awk '{print $2}' | sort -n | tail -1)
          if [ "${latest:-0}" -gt 0 ]; then
            echo "WireGuard handshake established on $WG_INTERFACE."
            exit 0
          fi
          ping -c 1 -W 1 "$first_ip" > /dev/null 2>&1 || sleep 1
        done

        echo "::error::No WireGuard handshake within ${WG_TIMEOUT}s. Check that the server lists this peer's public key, the endpoint is reachable on UDP, and the keys match."
        sudo wg show "$WG_INTERFACE" || true
        exit 1
