# ---------------------------------------------------------------------------
# Drop vulnerability-scanner probes before they reach an upstream.
#
# Included from server blocks. Bots sweep every host for leaked secrets and
# stock-CMS files (/.env, /.git/config, /wp-login.php, /phpinfo.php …). None of
# these exist here, but without this each probe cost a Next.js 404 render or a
# NestJS 404 plus an api/errors/404 log line. 444 closes the connection with no
# response, which also tells the scanner nothing about what is behind us.
#
# Keep the patterns to paths no real route can have: dotfile/dotdir segments
# (except /.well-known, which certbot needs), server-side script extensions we
# don't run, WordPress paths and repo/infra files.
# ---------------------------------------------------------------------------
location ~* (^|/)\.(?!well-known/)[^/]+|\.(php\d?|phtml|asp|aspx|jsp|cgi|bak|old|save|swp|sql)$|/(wp-admin|wp-includes|wp-content|wp-login|xmlrpc)|/(docker-compose\.ya?ml|Dockerfile|pnpm-workspace\.yaml|turbo\.json|service_account\.json|firebase-service-account\.json)$ {
    access_log off;
    return 444;
}
