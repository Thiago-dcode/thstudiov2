# Shared reverse-proxy parameters (included from location blocks).
proxy_http_version 1.1;

proxy_set_header Host              $host;

# $remote_addr is the real visitor IP (rewritten from CF-Connecting-IP by
# snippets/cloudflare.conf).
#
# X-Forwarded-For is set to exactly that value rather than appended via
# $proxy_add_x_forwarded_for: appending preserves whatever the client sent, so a
# request reaching the origin directly could prepend arbitrary entries and poison
# every IP-based rate limit, audit log and geo check downstream. There is only one
# trusted hop in front of us, so a single-value header is the honest representation.
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

# Strip the headers the API treats as privileged (they drive the 2FA trusted-device
# match). Safe to clear unconditionally: the Next.js server calls the API in-cluster
# at http://api:8080 and never traverses nginx, so anything arriving here carrying
# them is external by definition. Browsers hitting api.a11studio.com directly have no
# business setting them. RequestMiddleware also requires a valid x-app-token before
# honouring them — this is the outer of the two layers.
proxy_set_header x-app-ip-address  "";
proxy_set_header x-app-user-agent  "";

# WebSocket / HTTP upgrade support.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

proxy_connect_timeout 10s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

# Don't leak upstream framework fingerprints.
proxy_hide_header X-Powered-By;

# Kept off deliberately: Next.js streams RSC payloads, and buffering would delay
# first byte for every page.
proxy_buffering off;
