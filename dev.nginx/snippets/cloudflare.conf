# ---------------------------------------------------------------------------
# Cloudflare visitor-IP restore.
#
# Included at http level (before any server block) from conf.d/default.conf.
#
# DNS is "DNS only", so clients normally connect directly and $remote_addr is
# already the visitor. This stays so that if the proxy is ever re-enabled (or a
# request still arrives via Cloudflare during a DNS change), $remote_addr is
# rewritten from CF-Connecting-IP and logs, rate limiting and anything IP-based
# keep seeing the client rather than Cloudflare's edge.
#
# Safe on direct traffic: real_ip only trusts CF-Connecting-IP when the connecting
# peer is inside the ranges below, so a client cannot forge its address by
# sending the header itself.
#
# There used to be a `$is_cloudflare` allowlist here that the TLS vhosts used to
# refuse direct-to-origin traffic. It was removed with the switch to DNS only:
# keeping it would drop every visitor.
#
# Refresh the ranges from https://www.cloudflare.com/ips-v4 and .../ips-v6.
# ---------------------------------------------------------------------------

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# Cloudflare sets CF-Connecting-IP to the true client. Do not use X-Forwarded-For
# here: it is client-supplied and arrives forgeable on direct-to-origin requests.
real_ip_header CF-Connecting-IP;
real_ip_recursive off;
