# ---------------------------------------------------------------------------
# Response security headers. Included at server level in each TLS server block.
#
# `always` matters: without it these are attached only to 2xx/3xx responses, so
# error pages — often the most interesting ones to an attacker — would ship bare.
#
# Note on inheritance: add_header directives are NOT merged across levels. If a
# location block ever adds its own add_header, it must re-include this file or the
# server-level headers are dropped for that location.
# ---------------------------------------------------------------------------

# 2 years, preload-eligible. Only safe because every hostname is HTTPS-only.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# The upload pipeline stores attacker-influenced files served from the CDN domain;
# nosniff stops a mislabelled object being re-interpreted as HTML/JS.
add_header X-Content-Type-Options "nosniff" always;

add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# --- PERMANENT — DO NOT REMOVE ----------------------------------------------
# dev.a11studio.com serves content near-identical to production. Two hosts with
# the same content is the duplicate-content case Google penalises, so dev must
# never be indexed — this is not a pre-launch measure, it is permanent.
#
# Stronger than robots.txt: Disallow only stops crawling, but Google will still
# index a URL it finds linked elsewhere. X-Robots-Tag forbids indexing outright.
#
# This is the SECOND layer. The first is `isIndexableEnv()` in
# apps/web/src/lib/seo/indexability.ts, which only reports "indexable" when
# APP_URL's host is the canonical production host — needed because every
# environment runs NODE_ENV=production (`next start` requires it), so NODE_ENV
# alone cannot tell dev from prod. Keep both.
add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
# ----------------------------------------------------------------------------
