# ---------------------------------------------------------------------------
# TH Studio - nginx reverse proxy / load balancer
#
# Host-based routing behind Cloudflare (Full Strict).
#   dev.a11studio.com       -> web:3000
#   api.dev.a11studio.com   -> api:8080
#
# Upstreams (`web`, `api`) are resolved per-request via Docker embedded DNS
# (127.0.0.11), so `docker compose --scale` works without config changes.
# ---------------------------------------------------------------------------

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- Default: catch-all for healthchecks / unknown hosts --------------------
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    location / {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}

# --- HTTP: redirect all traffic to HTTPS -------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name dev.a11studio.com api.dev.a11studio.com;

    # Docker embedded DNS
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: dev.a11studio.com -> web:3000 -----------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name dev.a11studio.com;

    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 50m;

    ssl_certificate     /etc/nginx/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- Web (Next.js) --------------------------------------------------------
    location / {
        set $web_upstream web:3000;
        proxy_pass http://$web_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }
}

# --- HTTPS: api.dev.a11studio.com -> api:8080 -------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name api.dev.a11studio.com;

    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 50m;

    ssl_certificate     /etc/nginx/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- API (NestJS) ---------------------------------------------------------
    location / {
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }
}
