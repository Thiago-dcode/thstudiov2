# ---------------------------------------------------------------------------
# TH Studio - nginx reverse proxy / load balancer (Dev)
#
# Host-based routing. Clients connect directly (Cloudflare DNS only, no proxy).
#   dev.a11studio.com      -> web:3000
#   apidev.a11studio.com   -> api:8080
#
# Upstreams (`web`, `api`) are resolved per-request via Docker embedded DNS
# (127.0.0.11), so `docker compose --scale` works without config changes.
#
# Mirrors pro.nginx/conf.d/default.conf (see its header for why the Cloudflare
# proxy is off). Keep the two in sync.
#
# Certificate: one Let's Encrypt lineage named `dev.a11studio.com` covering
# dev.a11studio.com and apidev.a11studio.com. It must exist in the certbot_certs
# volume before this config is deployed, or nginx fails to start.
# ---------------------------------------------------------------------------

# Real-visitor-IP resolution for requests that arrive via Cloudflare (http context).
include /etc/nginx/snippets/cloudflare.conf;

server_tokens off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- Rate limiting ----------------------------------------------------------
limit_req_zone  $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone  $binary_remote_addr zone=auth:10m    rate=10r/m;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
limit_req_status  429;
limit_conn_status 429;

# --- Default: healthcheck only, everything else refused ---------------------
# Previously `return 200 "ok"` on `/` for any unknown host, which confirmed the
# origin was alive to anything scanning the droplet's IP.
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok";
    }

    location / {
        return 444;
    }
}

# --- Default HTTPS server: refuse unknown SNI -------------------------------
server {
    listen      443 ssl default_server;
    listen      [::]:443 ssl default_server;
    http2       on;
    server_name _;

    ssl_reject_handshake on;
}

# --- HTTP: redirect all traffic to HTTPS -------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name dev.a11studio.com apidev.a11studio.com;

    # Docker embedded DNS
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: dev.a11studio.com -> web:3000 -----------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name dev.a11studio.com;

    resolver 127.0.0.11 valid=10s ipv6=off;
    # 520m, not 50m: media uploads accept video up to MAX_VIDEO_UPLOAD_MB (500MB), and the
    # multipart envelope needs headroom on top. Keep in sync with packages/common-lib
    # constants/limits.ts and apps/web/next.config.ts serverActions.bodySizeLimit.
    client_max_body_size 520m;

    ssl_certificate     /etc/letsencrypt/live/dev.a11studio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.a11studio.com/privkey.pem;
    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;

    limit_conn conn_per_ip 50;

    # --- PERMANENT BLOCK ------------------------------------------------------
    # dev must never be crawled: it serves content near-identical to production,
    # and two indexed copies is the duplicate-content case Google penalises.
    # Second layer only — apps/web/src/app/robots.ts serves `Disallow: /` on its
    # own via `isIndexableEnv()`; this keeps dev blocked even if that gate is
    # ever weakened.
    #
    # History: Google indexed dev on 4-7 Aug 2026, before noindex existed. From
    # 2026-08-12 this served `Allow: /` so Google could re-crawl and see the
    # noindex (a `Disallow` blocks the fetch that would drop the pages). Closed
    # 2026-09-29, once GSC listed every dev URL as "Excluded by 'noindex' tag".
    # If dev URLs ever show up as indexed again, reopen that window rather than
    # relying on this block — blocking the crawl keeps them in the index.
    location = /robots.txt {
        access_log off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
    # ------------------------------------------------------------------------

    # --- Web (Next.js) --------------------------------------------------------
    location / {
        limit_req zone=general burst=60 nodelay;

        set $web_upstream web:3000;
        proxy_pass http://$web_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }
}

# --- HTTPS: apidev.a11studio.com -> api:8080 -------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name apidev.a11studio.com;

    resolver 127.0.0.11 valid=10s ipv6=off;
    # 520m, not 50m: media uploads accept video up to MAX_VIDEO_UPLOAD_MB (500MB), and the
    # multipart envelope needs headroom on top. Keep in sync with packages/common-lib
    # constants/limits.ts and apps/web/next.config.ts serverActions.bodySizeLimit.
    client_max_body_size 520m;

    ssl_certificate     /etc/letsencrypt/live/dev.a11studio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.a11studio.com/privkey.pem;
    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;

    limit_conn conn_per_ip 50;

    # --- Auth endpoints: tight limit --------------------------------------
    location ~ ^/api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;

        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }

    # --- API (NestJS) ---------------------------------------------------------
    location / {
        limit_req zone=general burst=60 nodelay;

        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }
}
