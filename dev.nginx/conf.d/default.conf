# ---------------------------------------------------------------------------
# TH Studio - nginx reverse proxy / load balancer (Dev)
#
# Host-based routing behind Cloudflare (Full Strict).
#   dev.a11studio.com      -> web:3000
#   apidev.a11studio.com   -> api:8080
#
# Upstreams (`web`, `api`) are resolved per-request via Docker embedded DNS
# (127.0.0.11), so `docker compose --scale` works without config changes.
#
# Mirrors pro.nginx/conf.d/default.conf. Keep the two in sync — dev holds a
# Cloudflare origin key that also covers the production hostnames, so a weaker
# posture here is a weaker posture for prod.
# ---------------------------------------------------------------------------

# Real-visitor-IP resolution + the $is_cloudflare allowlist variable (http context).
include /etc/nginx/snippets/cloudflare.conf;

server_tokens off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- Rate limiting ----------------------------------------------------------
limit_req_zone  $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone  $binary_remote_addr zone=auth:10m    rate=10r/m;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
limit_req_status  429;
limit_conn_status 429;

# --- Default: healthcheck only, everything else refused ---------------------
# Previously `return 200 "ok"` on `/` for any unknown host, which confirmed the
# origin was alive to anything scanning the droplet's IP.
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok";
    }

    location / {
        return 444;
    }
}

# --- Default HTTPS server: refuse unknown SNI -------------------------------
server {
    listen      443 ssl default_server;
    listen      [::]:443 ssl default_server;
    http2       on;
    server_name _;

    ssl_reject_handshake on;
}

# --- HTTP: redirect all traffic to HTTPS -------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name dev.a11studio.com apidev.a11studio.com;

    # Docker embedded DNS
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: dev.a11studio.com -> web:3000 -----------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name dev.a11studio.com;

    if ($is_cloudflare = 0) {
        return 444;
    }

    resolver 127.0.0.11 valid=10s ipv6=off;
    # 320m, not 50m: media uploads accept video up to MAX_VIDEO_UPLOAD_MB (300MB), and the
    # multipart envelope needs headroom on top. Keep in sync with packages/common-lib
    # constants/limits.ts and apps/web/next.config.ts serverActions.bodySizeLimit.
    client_max_body_size 320m;

    ssl_certificate     /etc/nginx/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;
    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;

    limit_conn conn_per_ip 50;

    # --- TEMPORARY DE-INDEXING WINDOW — opened 2026-08-12 --------------------
    # ⚠️ This deliberately serves `Allow: /` on dev. Read before changing it.
    #
    # dev was crawlable with no noindex and no robots block until 34856f1
    # (2026-08-09) added them; Google crawled and indexed it on 4-7 Aug 2026.
    # Search Console lists ~10 dev URLs (/es/faqs, /pt/artists/thsworld, several
    # /media/... pages).
    #
    # `Disallow: /` cannot remove them — it blocks the CRAWL, so Google can never
    # fetch the pages to see the `X-Robots-Tag: noindex` that would drop them.
    # Blocking is what keeps them in the index. To de-index we must let Google
    # back in while every response still says noindex.
    #
    # Safe while open: security-headers.conf sends
    # `X-Robots-Tag: noindex, nofollow, noarchive` on EVERY response (`always`),
    # and the app sends `noindex, nofollow, noarchive, nocache` in the page head,
    # so nothing can be (re-)indexed during the window.
    #
    # The override is required rather than just deleting this block: the app's
    # own robots.ts returns `Disallow: /` here too, because `isIndexableEnv()`
    # only reports indexable on the canonical production host.
    #
    # CLOSE THIS WINDOW when GSC > Pages reports zero indexed dev.a11studio.com
    # URLs: restore the PERMANENT block below and delete this one.
    location = /robots.txt {
        access_log off;
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\n";
    }
    #
    # --- PERMANENT BLOCK — restore this once de-indexing is confirmed --------
    # dev must never be crawled long-term: it serves content near-identical to
    # production, and two indexed copies is the duplicate-content case Google
    # penalises. Second layer only — apps/web/src/app/robots.ts serves
    # `Disallow: /` on its own via `isIndexableEnv()`; this keeps dev blocked
    # even if that gate is ever weakened.
    #
    # location = /robots.txt {
    #     access_log off;
    #     default_type text/plain;
    #     return 200 "User-agent: *\nDisallow: /\n";
    # }
    # ------------------------------------------------------------------------

    # --- Web (Next.js) --------------------------------------------------------
    location / {
        limit_req zone=general burst=60 nodelay;

        set $web_upstream web:3000;
        proxy_pass http://$web_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }
}

# --- HTTPS: apidev.a11studio.com -> api:8080 -------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name apidev.a11studio.com;

    if ($is_cloudflare = 0) {
        return 444;
    }

    resolver 127.0.0.11 valid=10s ipv6=off;
    # 320m, not 50m: media uploads accept video up to MAX_VIDEO_UPLOAD_MB (300MB), and the
    # multipart envelope needs headroom on top. Keep in sync with packages/common-lib
    # constants/limits.ts and apps/web/next.config.ts serverActions.bodySizeLimit.
    client_max_body_size 320m;

    ssl_certificate     /etc/nginx/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;
    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;

    limit_conn conn_per_ip 50;

    # --- Auth endpoints: tight limit --------------------------------------
    location ~ ^/api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;

        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }

    # --- API (NestJS) ---------------------------------------------------------
    location / {
        limit_req zone=general burst=60 nodelay;

        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }
}
