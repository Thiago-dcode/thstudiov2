# ---------------------------------------------------------------------------
# TH Studio - nginx reverse proxy / load balancer
#
# Upstreams (`web`, `api`) are NOT declared in static `upstream {}` blocks.
# Instead the Docker service name is resolved on every request through the
# Docker embedded DNS resolver (127.0.0.11). This means that when a service is
# scaled, e.g.
#
#     docker compose -f compose.dev.yaml up -d --scale web=3 --scale api=3
#
# nginx automatically load-balances (round-robin) across all running replicas
# without any config change or reload.
# ---------------------------------------------------------------------------

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    # Docker embedded DNS - required for per-request upstream re-resolution.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Allow reasonably large uploads (media, etc.).
    client_max_body_size 50m;

    # Let's Encrypt HTTP-01 challenge files served by the certbot service.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- API (NestJS) ---------------------------------------------------------
    location /api/ {
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }

    # --- Static assets (served by NestJS ServeStaticModule at /assets) --------
    location /assets/ {
        set $api_upstream api:8080;
        proxy_pass         http://$api_upstream;
        include            /etc/nginx/snippets/proxy.conf;

        # Long-lived cache for versioned / immutable static files.
        expires            30d;
        add_header         Cache-Control "public, max-age=2592000, immutable";
    }

    # --- Web (Next.js) --------------------------------------------------------
    location / {
        set $web_upstream web:3000;
        proxy_pass http://$web_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }
}
