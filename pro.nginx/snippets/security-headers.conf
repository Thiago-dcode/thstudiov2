# ---------------------------------------------------------------------------
# Response security headers. Included at server level in each TLS server block.
#
# `always` matters: without it these are attached only to 2xx/3xx responses, so
# error pages — often the most interesting ones to an attacker — would ship bare.
#
# Note on inheritance: add_header directives are NOT merged across levels. If a
# location block ever adds its own add_header, it must re-include this file or the
# server-level headers are dropped for that location.
# ---------------------------------------------------------------------------

# 2 years, preload-eligible. Only safe because every hostname is HTTPS-only.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# The upload pipeline stores attacker-influenced files served from the CDN domain;
# nosniff stops a mislabelled object being re-interpreted as HTML/JS.
add_header X-Content-Type-Options "nosniff" always;

add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# --- PRE-LAUNCH ONLY — REMOVE BEFORE GOING LIVE -----------------------------
# Prod is deployed but unfinished (cdn.a11studio.com has no DNS record, so every
# image 404s). Being crawled in that state puts a broken site in Google's index,
# which is slow to undo.
#
# Stronger than robots.txt: Disallow only stops crawling, and Google will still
# index a URL it finds linked elsewhere. X-Robots-Tag forbids indexing outright.
#
# Cloudflare Access is the primary gate — crawlers never reach this origin at all.
# This header is the safety net *behind* it: what protects the site if the Access
# app is ever misconfigured, and during the window between removing the gate and
# being ready to be found.
#
# Removal order at launch matters — see the plan's Launch checklist. Drop this
# block BEFORE deleting the Access application, never after.
add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
# ----------------------------------------------------------------------------
