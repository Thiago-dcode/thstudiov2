# ---------------------------------------------------------------------------
# Shared TLS parameters (included from each 443 server block).
#
# Replaces `ssl_ciphers HIGH:!aNULL:!MD5`, whose OpenSSL `HIGH` alias still admits
# CBC-mode and SHA-1 suites plus static RSA key exchange (no forward secrecy).
# The list below is TLS 1.2 ECDHE-only; TLS 1.3 suites are negotiated separately
# and are not configurable via ssl_ciphers.
# ---------------------------------------------------------------------------

ssl_protocols             TLSv1.2 TLSv1.3;
ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_ecdh_curve            X25519:prime256v1:secp384r1;

ssl_session_cache         shared:SSL:10m;
ssl_session_timeout       1d;
# Session tickets without rotation undermine forward secrecy.
ssl_session_tickets       off;
