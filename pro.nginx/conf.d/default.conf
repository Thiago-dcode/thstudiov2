# ---------------------------------------------------------------------------
# TH Studio - nginx reverse proxy / load balancer (Production)
#
# Host-based routing. Clients connect directly (Cloudflare DNS only, no proxy).
#   a11studio.com       -> web:3000   (canonical host)
#   www.a11studio.com   -> 301 a11studio.com
#   api.a11studio.com   -> api:8080
#
# Upstreams (`web`, `api`) are resolved per-request via Docker embedded DNS
# (127.0.0.11), so `docker compose --scale` works without config changes.
#
# Why no Cloudflare proxy: during LaLiga matches Spanish ISPs block Cloudflare's
# shared edge IPs, which took the site down for Spanish visitors. The vhosts serve
# a publicly trusted Let's Encrypt certificate and accept direct traffic. If the
# proxy is ever switched back on, re-add `include /etc/nginx/snippets/cloudflare.conf;`
# below so $remote_addr is the visitor again rather than a Cloudflare edge address
# (Full Strict accepts the Let's Encrypt cert as is).
#
# Certificate: one Let's Encrypt lineage named `a11studio.com` covering
# a11studio.com, www.a11studio.com and api.a11studio.com. It must exist in the
# certbot_certs volume before this config is deployed, or nginx fails to start.
# ---------------------------------------------------------------------------

# No real_ip mapping: with DNS pointing straight at the droplet, $remote_addr is the
# visitor. Trusting CF-Connecting-IP from Cloudflare ranges would now only let a
# request sent through Cloudflare egress (a Worker, another zone) pick its own
# rate-limit bucket.

# Don't advertise the nginx version in Server: headers and error pages.
server_tokens off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- Rate limiting ----------------------------------------------------------
# Keyed on $binary_remote_addr, the visitor IP (traffic reaches the droplet directly).
# If the Cloudflare proxy is switched back on, this needs the real_ip mapping again
# or every request is bucketed under a Cloudflare edge address.
limit_req_zone  $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone  $binary_remote_addr zone=auth:10m    rate=10r/m;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
limit_req_status  429;
limit_conn_status 429;

# --- Default HTTP server ----------------------------------------------------
# Prod previously had no default_server on :80, so the container healthcheck
# (wget http://127.0.0.1/) fell through to the a11studio.com block and got a 301
# to HTTPS. Serve an explicit health endpoint and refuse everything else.
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok";
    }

    location / {
        return 444;
    }
}

# --- Default HTTPS server ---------------------------------------------------
# Without this, a TLS request with an unknown/absent SNI (i.e. straight to the
# droplet IP, which is what scanners do) falls through to the first 443 block and
# is served the production app.
# `ssl_reject_handshake` drops the handshake without needing a certificate.
server {
    listen      443 ssl default_server;
    listen      [::]:443 ssl default_server;
    http2       on;
    server_name _;

    ssl_reject_handshake on;
}

# --- HTTP: redirect all traffic to HTTPS -------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name a11studio.com api.a11studio.com;

    # Docker embedded DNS
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- www.a11studio.com -> 301 to the apex -----------------------------------
# `a11studio.com` (no www) is the canonical host: it is what APP_URL is set to, and
# therefore what every canonical tag, hreflang alternate, sitemap <loc> and the
# robots.txt `Host:` line already point at.
#
# Without these two blocks `www` matched no server_name, fell through to the
# `ssl_reject_handshake` default server, and Cloudflare answered **525** — so anyone
# typing the www form (which the email footer used to display) got an error page.
# www is a SAN on the Let's Encrypt certificate, so a vhost is all that was missing.
#
# 301 rather than serving the app on both hosts: two hostnames serving identical
# content splits crawl budget and cookies, and leaves Google to guess the canonical.
server {
    listen      80;
    listen      [::]:80;
    server_name www.a11studio.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Straight to the canonical host — redirecting to https://www first would cost an
    # extra hop for no reason.
    location / {
        return 301 https://a11studio.com$request_uri;
    }
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name www.a11studio.com;

    ssl_certificate     /etc/letsencrypt/live/a11studio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/a11studio.com/privkey.pem;
    include /etc/nginx/snippets/tls.conf;
    # HSTS must be present on this response too, or the redirect is a preload-eligibility hole.
    include /etc/nginx/snippets/security-headers.conf;

    limit_conn conn_per_ip 50;
    limit_req  zone=general burst=60 nodelay;

    return 301 https://a11studio.com$request_uri;
}

# --- HTTPS: a11studio.com -> web:3000 -----------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name a11studio.com;

    resolver 127.0.0.11 valid=10s ipv6=off;
    # 520m, not 50m: media uploads accept video up to MAX_VIDEO_UPLOAD_MB (500MB), and the
    # multipart envelope needs headroom on top. Keep in sync with packages/common-lib
    # constants/limits.ts and apps/web/next.config.ts serverActions.bodySizeLimit.
    client_max_body_size 520m;

    ssl_certificate     /etc/letsencrypt/live/a11studio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/a11studio.com/privkey.pem;
    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;

    limit_conn conn_per_ip 50;

    # /robots.txt is served by the app (apps/web/src/app/robots.ts), which advertises
    # `Allow: /`, the authed-area disallows, `Host:` and one `Sitemap:` line per child
    # shard. The pre-launch nginx override that returned `Disallow: /` was removed at
    # launch; it must not come back, or the advertised sitemaps disappear with it.

    include /etc/nginx/snippets/scanner-block.conf;

    # --- Web (Next.js) --------------------------------------------------------
    location / {
        limit_req zone=general burst=60 nodelay;

        set $web_upstream web:3000;
        proxy_pass http://$web_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }
}

# --- HTTPS: api.a11studio.com -> api:8080 -------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name api.a11studio.com;

    resolver 127.0.0.11 valid=10s ipv6=off;
    # 520m, not 50m: media uploads accept video up to MAX_VIDEO_UPLOAD_MB (500MB), and the
    # multipart envelope needs headroom on top. Keep in sync with packages/common-lib
    # constants/limits.ts and apps/web/next.config.ts serverActions.bodySizeLimit.
    client_max_body_size 520m;

    ssl_certificate     /etc/letsencrypt/live/a11studio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/a11studio.com/privkey.pem;
    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;

    limit_conn conn_per_ip 50;

    include /etc/nginx/snippets/scanner-block.conf;

    # --- Auth endpoints: tight limit --------------------------------------
    # Credential stuffing, password-reset spraying and 2FA brute force all land
    # here. The API's own ThrottlerGuard is a second layer, not a substitute.
    location ~ ^/api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;

        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }

    # --- API (NestJS) ---------------------------------------------------------
    # Every production route lives under /api/v1/ (RouterModule in apps/api/src/app.module.ts).
    location /api/v1/ {
        limit_req zone=general burst=60 nodelay;

        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }

    # --- WebSocket (socket.io) ------------------------------------------------
    # The notifications gateway on socket.io's default path; the namespace travels in the
    # handshake, not the URL. proxy.conf already forwards Upgrade/Connection, and its 60s
    # read timeout sits above socket.io's 25s ping + 20s timeout, so idle sockets stay open.
    location /socket.io/ {
        limit_req zone=general burst=60 nodelay;

        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }

    # Liveness for external monitors: the API answers `GET /` with {status: "ok"}.
    # `POST /` is a scanner staple, so only GET/HEAD get through.
    location = / {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 444;
        }
        limit_req zone=general burst=60 nodelay;

        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }

    # Anything else cannot be a route: drop it here rather than have the API render a
    # 404 and write an api/errors/404 line for every scanner probe.
    location / {
        access_log off;
        return 444;
    }
}
