# ---------------------------------------------------------------------------
# TH Studio - nginx reverse proxy / load balancer (Production)
#
# Host-based routing behind Cloudflare (Full Strict).
#   a11studio.com       -> web:3000   (canonical host)
#   www.a11studio.com   -> 301 a11studio.com
#   api.a11studio.com   -> api:8080
#
# Upstreams (`web`, `api`) are resolved per-request via Docker embedded DNS
# (127.0.0.11), so `docker compose --scale` works without config changes.
#
# The droplet's public IP is reachable directly, so this config must not assume
# every request arrived through Cloudflare — see snippets/cloudflare.conf and the
# `$is_cloudflare` checks below.
# ---------------------------------------------------------------------------

# Real-visitor-IP resolution + the $is_cloudflare allowlist variable (http context).
include /etc/nginx/snippets/cloudflare.conf;

# Don't advertise the nginx version in Server: headers and error pages.
server_tokens off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- Rate limiting ----------------------------------------------------------
# Keyed on $binary_remote_addr, which is the real visitor IP thanks to real_ip
# above. Without the Cloudflare real_ip mapping this would bucket every request
# under Cloudflare's edge address and be useless.
limit_req_zone  $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone  $binary_remote_addr zone=auth:10m    rate=10r/m;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
limit_req_status  429;
limit_conn_status 429;

# --- Default HTTP server ----------------------------------------------------
# Prod previously had no default_server on :80, so the container healthcheck
# (wget http://127.0.0.1/) fell through to the a11studio.com block and got a 301
# to HTTPS. Serve an explicit health endpoint and refuse everything else.
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok";
    }

    location / {
        return 444;
    }
}

# --- Default HTTPS server ---------------------------------------------------
# Without this, a TLS request with an unknown/absent SNI (i.e. straight to the
# droplet IP) falls through to the first 443 block and is served the production
# app under the origin certificate, bypassing Cloudflare completely.
# `ssl_reject_handshake` drops the handshake without needing a certificate.
server {
    listen      443 ssl default_server;
    listen      [::]:443 ssl default_server;
    http2       on;
    server_name _;

    ssl_reject_handshake on;
}

# --- HTTP: redirect all traffic to HTTPS -------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name a11studio.com api.a11studio.com;

    # Docker embedded DNS
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- www.a11studio.com -> 301 to the apex -----------------------------------
# `a11studio.com` (no www) is the canonical host: it is what APP_URL is set to, and
# therefore what every canonical tag, hreflang alternate, sitemap <loc> and the
# robots.txt `Host:` line already point at.
#
# Without these two blocks `www` matched no server_name, fell through to the
# `ssl_reject_handshake` default server, and Cloudflare answered **525** — so anyone
# typing the www form (which the email footer used to display) got an error page.
# DNS for www is already proxied and the origin cert covers `*.a11studio.com`, so a
# vhost is all that was missing.
#
# 301 rather than serving the app on both hosts: two hostnames serving identical
# content splits crawl budget and cookies, and leaves Google to guess the canonical.
server {
    listen      80;
    listen      [::]:80;
    server_name www.a11studio.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Straight to the canonical host — redirecting to https://www first would cost an
    # extra hop for no reason.
    location / {
        return 301 https://a11studio.com$request_uri;
    }
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name www.a11studio.com;

    # Same origin lockdown as the apex vhost.
    if ($is_cloudflare = 0) {
        return 444;
    }

    ssl_certificate     /etc/nginx/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;
    include /etc/nginx/snippets/tls.conf;
    # HSTS must be present on this response too, or the redirect is a preload-eligibility hole.
    include /etc/nginx/snippets/security-headers.conf;

    limit_conn conn_per_ip 50;
    limit_req  zone=general burst=60 nodelay;

    return 301 https://a11studio.com$request_uri;
}

# --- HTTPS: a11studio.com -> web:3000 -----------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name a11studio.com;

    # Refuse anything that did not come through Cloudflare.
    if ($is_cloudflare = 0) {
        return 444;
    }

    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 50m;

    ssl_certificate     /etc/nginx/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;
    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;

    limit_conn conn_per_ip 50;

    # /robots.txt is served by the app (apps/web/src/app/robots.ts), which advertises
    # `Allow: /`, the authed-area disallows, `Host:` and one `Sitemap:` line per child
    # shard. The pre-launch nginx override that returned `Disallow: /` was removed at
    # launch; it must not come back, or the advertised sitemaps disappear with it.

    # --- Web (Next.js) --------------------------------------------------------
    location / {
        limit_req zone=general burst=60 nodelay;

        set $web_upstream web:3000;
        proxy_pass http://$web_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }
}

# --- HTTPS: api.a11studio.com -> api:8080 -------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name api.a11studio.com;

    if ($is_cloudflare = 0) {
        return 444;
    }

    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 50m;

    ssl_certificate     /etc/nginx/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;
    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;

    limit_conn conn_per_ip 50;

    # --- Auth endpoints: tight limit --------------------------------------
    # Credential stuffing, password-reset spraying and 2FA brute force all land
    # here. The API's own ThrottlerGuard is a second layer, not a substitute.
    location ~ ^/api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;

        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }

    # --- API (NestJS) ---------------------------------------------------------
    location / {
        limit_req zone=general burst=60 nodelay;

        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }
}
