name: a11studio-prod

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: a11studio-prod-nginx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # The only public entrypoint on the droplet. 443 is ready for TLS once
    # certificates are issued (see nginx/ssl.conf.template).
    ports:
      - "${HTTP_HOST_PORT:-80}:80"
      - "${HTTPS_HOST_PORT:-443}:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./certs:/etc/nginx/certs:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      # /healthz, not /: the default server now returns 444 for unknown hosts so the
      # origin doesn't confirm liveness to scanners. See pro.nginx/conf.d/default.conf.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
      start_interval: 3s
    networks:
      - a11studio-prod

  certbot:
    image: certbot/certbot
    container_name: a11studio-prod-certbot
    # Run on demand only:
    #   docker compose -f compose.prod.yaml --profile ssl run --rm certbot
    profiles:
      - ssl
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # exec form, not `sh -c`: the previous version spliced ${DOMAIN} and
    # ${LETSENCRYPT_EMAIL} unquoted into a shell string, so a .env value containing
    # `;` or backticks executed arbitrary commands in a container holding the certs.
    entrypoint:
      - certbot
      - certonly
      - --webroot
      - -w
      - /var/www/certbot
      - --email
      - ${LETSENCRYPT_EMAIL:-}
      - -d
      - ${DOMAIN:-}
      - --agree-tos
      - --no-eff-email
      - --non-interactive

  api:
    # Prebuilt in GitHub Actions and pulled on the droplet (see docs/deploy-ghcr.md).
    # `build:` remains for local `docker compose build` when developing offline.
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_IMAGE_OWNER:?Set DOCKER_IMAGE_OWNER in .env}/a11studio-prod-api:${DOCKER_IMAGE_TAG:-main}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    pull_policy: always
    # No container_name / fixed host port: this service sits behind nginx and is
    # scaled horizontally (load balanced by nginx via Docker DNS).
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - ${A11STUDIO_ENV_FILE:-.env}
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379
      API_PORT: 8080
    volumes:
      - ./storage/logs:/workspace/storage/logs
      # Local-only seed binaries (gitignored); used when running db:seed inside the api container
      - ./packages/database/src/seeds/media-images:/workspace/packages/database/src/seeds/media-images
      - ./packages/database/src/seeds/assets:/workspace/packages/database/src/seeds/assets
    expose:
      - "8080"
    deploy:
      replicas: ${API_REPLICAS:-2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
      start_interval: 3s
    networks:
      - a11studio-prod

  web:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_IMAGE_OWNER:?Set DOCKER_IMAGE_OWNER in .env}/a11studio-prod-web:${DOCKER_IMAGE_TAG:-main}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://a11studio.com}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.a11studio.com/api/v1}
        NEXT_PUBLIC_GEOAPIFY_URL: ${NEXT_PUBLIC_GEOAPIFY_URL}
        NEXT_PUBLIC_GEOAPIFY_KEY: ${NEXT_PUBLIC_GEOAPIFY_KEY}
        APP_URL: ${APP_URL}
        API_V1_URL: ${API_V1_URL}
        GEOAPIFY_URL: ${GEOAPIFY_URL}
        SUPPORT_EMAIL: ${SUPPORT_EMAIL}
        SUPPORT_USERNAME: ${SUPPORT_USERNAME}
        REGISTRATION_IS_CLOSED: ${REGISTRATION_IS_CLOSED}
        # Baked into next/image remotePatterns at build time (see apps/web/Dockerfile).
        CDN_URL: ${CDN_URL}
      # Secrets, not build args: a build arg is promoted to ENV in the builder stage
      # and therefore persists in layer metadata and any exported build cache.
      secrets:
        - app_api_key
        - app_token
        - geoapify_key
        - encryption_secret
    pull_policy: always
    # No container_name / fixed host port: this service sits behind nginx and is
    # scaled horizontally (load balanced by nginx via Docker DNS).
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - ${A11STUDIO_ENV_FILE:-.env}
    environment:
      # next start requires production mode.
      NODE_ENV: production
      PORT: 3000
      # Server-side calls from the web container must reach the api service by name,
      # not localhost (which would resolve to the web container itself).
      API_URL: http://api:8080
      API_V1_URL: http://api:8080/api/v1
    expose:
      - "3000"
    deploy:
      replicas: ${WEB_REPLICAS:-2}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Probe /robots.txt, NOT `/`. `/` redirects into /[locale] and fetch follows
      # redirects, so every probe rendered the whole landing page — four API calls
      # each, x2 replicas, every 30s, and every 3s during start_period. That alone
      # was a large share of the 429s on /assets/* and /portfolios/featured.
      # robots.txt exercises the same server but makes at most one API call per hour
      # (its data is revalidate-cached and degrades to a fallback rather than throwing).
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/robots.txt').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
      start_interval: 10s
    networks:
      - a11studio-prod

  worker:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_IMAGE_OWNER:?Set DOCKER_IMAGE_OWNER in .env}/a11studio-prod-worker:${DOCKER_IMAGE_TAG:-main}
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    pull_policy: always
    container_name: a11studio-prod-worker
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - ${A11STUDIO_ENV_FILE:-.env}
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379
      WORKER_PORT: 8081
    # Bind the worker health port to localhost only - not exposed publicly.
    ports:
      - "127.0.0.1:${WORKER_HOST_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8081/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 3s
    networks:
      - a11studio-prod

  postgres:
    image: postgres:15-alpine
    container_name: a11studio-prod-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_INITDB_ARGS: --encoding=UTF-8 --lc-collate=C --lc-ctype=C
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 2s
    networks:
      - a11studio-prod

  redis:
    image: redis:7-alpine
    container_name: a11studio-prod-redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
      start_interval: 2s
    networks:
      - a11studio-prod

  pgadmin:
    image: dpage/pgadmin4
    container_name: a11studio-prod-pgadmin
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    profiles:
      - tools
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "127.0.0.1:${PGADMIN_HOST_PORT:-8888}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - a11studio-prod

# Build-time secrets sourced from the environment (i.e. the .env loaded by compose).
# Referenced by the web service's `build.secrets`; consumed via `--mount=type=secret`
# in apps/web/Dockerfile so they never reach a layer or the build cache.
secrets:
  app_api_key:
    environment: APP_API_KEY
  app_token:
    environment: APP_TOKEN
  geoapify_key:
    environment: GEOAPIFY_KEY
  encryption_secret:
    environment: ENCRYPTION_SECRET

networks:
  a11studio-prod:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  certbot_certs:
  certbot_www:
